services:
  app:
    build:
      context: .
      target: builder
    image: laravel_app_dev
    container_name: laravel_app
    user: "www-data"
    working_dir: /var/www/html
    ports:
      - "3060:8000"
    env_file:
      - .env
    environment:
      # Reforce local development behavior; adapt via .env if necessário.
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://127.0.0.1:3060
    volumes:
      # Bind the source code for hot reload and live editing.
      - ./:/var/www/html:cached
      - ./storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c "composer install --prefer-dist --no-scripts --no-progress --no-interaction --optimize-autoloader && php artisan optimize:clear && php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD", "sh", "-c", "php artisan route:list >/dev/null 2>&1"]
      interval: 30s
      timeout: 30s
      retries: 3

  vite:
    image: node:20-alpine
    container_name: laravel_vite
    working_dir: /var/www/html
    ports:
      - "3061:5173"
    env_file:
      - .env
    environment:
      # Force polling on some mounted filesystem setups and expose Vite.
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/var/www/html:cached
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3061"
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  node_modules:
